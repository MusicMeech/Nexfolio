<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nexfolio – Digital catalogue cards for jewellery stores</title>
<style>
:root{--bg:#030906;--sf:#0a1612;--sf2:#102520;--tx:#f1faf6;--mut:#9db5aa;--p:#34d399;--p2:#7ef0c4;--gold:#c9a45c;--rgb:52,211,153;--rgb2:126,240,196;--bd:rgba(var(--rgb),.25);--g1:#4ef0b4;--g2:#10b981;--btx:#03150d;--mesh:#0c4a36;--d0:#050d0a;--d1:#0f2a21;--ph:#12231d;--cov1:#10b981;--cov2:#064e3b;--nwi:#0d3326;--hdr:rgba(3,9,6,.65);--ink:#08140f;--h1:#dde1ea;--h1t:#10231c;--h2:#174838;--h2t:#d9fbe9;--h3:#d4c09a;--h3t:#10231c;--lf:none;--lb:normal;box-sizing:border-box;background:var(--bg);color-scheme:var(--cs,dark);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1100px 650px at 75% -120px,var(--mesh) 0,transparent 60%),var(--bg);color:var(--tx);font:17px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.w{max-width:1080px;margin:auto;padding:0 22px}
section{padding:90px 0;position:relative}
h1{font-size:clamp(38px,7vw,64px);line-height:1.1;margin:0 0 24px;letter-spacing:-.02em}
h1 span{display:block}h1 .pu{color:var(--p)}
h2{font-size:clamp(28px,4.5vw,40px);margin:0 0 14px;line-height:1.2}h3{margin:0 0 8px;font-size:20px}
p{color:var(--mut);margin:0 0 20px}.lead{font-size:19px;max-width:620px}.c{text-align:center}.c .lead{margin-inline:auto}
.tag{display:inline-block;border:1px solid var(--bd);background:rgba(var(--rgb),.08);color:var(--p2);padding:7px 18px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.16em;margin-bottom:24px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btx);padding:15px 32px;border-radius:14px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:16px;margin:0 12px 14px 0;transition:.3s;box-shadow:0 8px 28px rgba(var(--rgb),.3);position:relative;overflow:hidden}
.btn:before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sw 3.5s infinite}
@keyframes sw{60%,100%{left:140%}}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(var(--rgb),.5)}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.o:before{display:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
nav img{height:46px;display:block}nav a{color:var(--mut);text-decoration:none;margin-left:24px;font-size:15px;transition:.2s}nav a:hover{color:var(--p)}
nav .cta{color:var(--btx);background:var(--p);padding:8px 18px;border-radius:99px;font-weight:600}nav .cta:hover{color:var(--btx)}
.page{display:none}.page.on{display:block;animation:pg .7s both}@keyframes pg{from{opacity:0;transform:translateY(16px)}}
.hero{display:grid;gap:60px;align-items:center;padding:40px 0 60px}@media(min-width:900px){.hero{grid-template-columns:1fr 1.1fr}}
.tl{letter-spacing:.3em;font-size:12px;color:var(--mut);margin-top:22px}
.ill{position:relative;height:500px;max-width:520px;margin:auto;width:100%}
.ring{position:absolute;left:-6%;right:-6%;top:42%;height:210px;border:2px solid rgba(var(--rgb2),.75);border-radius:50%;transform:rotate(-14deg);box-shadow:0 0 40px rgba(var(--rgb),.6),inset 0 0 40px rgba(var(--rgb),.25);animation:spin 8s ease-in-out infinite}
.ring.b{transform:rotate(-14deg) scale(1.12);opacity:.35;animation-delay:-3s}
@keyframes spin{50%{transform:rotate(-10deg) scale(1.03)}}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;background:var(--g2);filter:blur(90px);opacity:.4;top:60px;right:40px;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px)}}
.ph1{position:absolute;right:6%;top:0;width:250px;height:480px;border:8px solid var(--ph);border-radius:38px;background:var(--d0);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px var(--bd);transform:rotate(7deg);animation:fl 6s ease-in-out infinite;overflow:hidden;padding:30px 12px 12px}
.ph1:before{content:"";position:absolute;top:0;left:50%;width:80px;height:18px;margin-left:-40px;background:var(--ph);border-radius:0 0 12px 12px}
.ph1 small{color:var(--mut);font-size:11px;display:block;margin-bottom:10px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg i{height:118px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;font-style:normal;background:linear-gradient(145deg,var(--sf2),var(--sf));border:1px solid var(--bd);animation:pop 4s ease-in-out infinite}
.tg i:nth-child(2){animation-delay:.5s}.tg i:nth-child(3){animation-delay:1s}.tg i:nth-child(4){animation-delay:1.5s}
@keyframes pop{50%{transform:scale(1.05);box-shadow:0 0 22px rgba(var(--rgb),.5)}}
.bc{position:absolute;left:0;bottom:50px;width:300px;height:180px;border-radius:18px;background:linear-gradient(135deg,var(--d1),var(--d0));border:1px solid rgba(var(--rgb2),.5);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(var(--rgb),.35);transform:rotate(-8deg);padding:20px;display:flex;justify-content:space-between;align-items:center;transition:.4s;animation:fl 7s ease-in-out infinite;animation-delay:-2s;z-index:3}
.bc:hover{transform:rotate(-3deg) scale(1.05)}.bc img{height:46px;display:block;margin-bottom:8px}.bc small{color:var(--mut);font-size:9px;letter-spacing:.2em}
.qr{width:96px;height:96px;background:#fff;border-radius:8px;padding:6px;position:relative;flex:none}
.laser{position:absolute;left:0;right:0;height:3px;background:var(--p);box-shadow:0 0 14px var(--p);top:0;opacity:0}
.scanning .laser{animation:ls 1.2s ease-in-out 1}@keyframes ls{0%{top:0;opacity:1}100%{top:calc(100% - 3px);opacity:1}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.grid{display:grid;gap:26px;margin-top:50px}@media(min-width:760px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}}
.box{background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--bd);border-radius:20px;padding:30px;transition:.3s}
.box:hover{transform:translateY(-8px);border-color:var(--p);box-shadow:0 18px 44px rgba(var(--rgb),.2)}
.ic{width:54px;height:54px;border-radius:14px;background:rgba(var(--rgb),.12);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.demo{display:grid;gap:50px;align-items:center;margin-top:50px}@media(min-width:860px){.demo{grid-template-columns:1fr 1fr}}
.stage{display:flex;flex-direction:column;align-items:center;gap:30px}
.card{width:300px;height:180px;background:linear-gradient(135deg,var(--d1),var(--d0));border:1px solid rgba(var(--rgb2),.5);border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 40px rgba(var(--rgb),.3)}
.card small{color:var(--mut);display:block}.card b{font-size:18px}
.phone{width:290px;height:580px;border:9px solid var(--ph);border-radius:40px;background:var(--d0);overflow:hidden;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 40px rgba(var(--rgb),.2)}
.scr{height:100%;overflow-y:auto;opacity:0;transition:opacity .6s;scrollbar-width:none;padding-top:20px}.scr::-webkit-scrollbar{display:none}.phone.on .scr{opacity:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:14px;padding:24px;transition:.4s;z-index:4;background:var(--d0);gap:6px}.phone.on .ph{opacity:0;pointer-events:none}
.cov{background:linear-gradient(160deg,var(--cov1),var(--cov2));padding:26px 18px;text-align:center;color:#fff}

.cov b{font-size:19px;display:block}.cov span{font-size:12px;opacity:.9}
.pc{padding:18px 16px 4px;font-size:13px}.pc h4{margin:0 0 6px;font-size:15px}.pc p{font-size:12.5px;line-height:1.55;margin:0 0 8px}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.nw{flex:none;width:118px;background:var(--sf2);border-radius:12px;padding:8px;font-size:11.5px;position:relative}
.nw i{display:flex;height:74px;border-radius:8px;align-items:center;justify-content:center;font-size:30px;font-style:normal;margin-bottom:6px;background:var(--nwi)}
.nw em{position:absolute;top:12px;left:12px;background:var(--p);color:var(--btx);font-size:9px;padding:1px 6px;border-radius:6px;font-style:normal;font-weight:700}
.nw span{display:block;color:var(--p2);font-weight:700}.pg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pg2 .nw{width:auto}
.ct{margin:6px 16px 20px;display:grid;gap:8px;font-size:12.5px}.ct div{background:var(--sf2);border-radius:10px;padding:9px 12px;color:var(--mut)}
.ct a{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btx);text-align:center;border-radius:10px;padding:10px;text-decoration:none;font-weight:700}
.pop-in .scr>*{animation:pi .6s both}.pop-in .scr>*:nth-child(2){animation-delay:.2s}.pop-in .scr>*:nth-child(3){animation-delay:.4s}@keyframes pi{from{opacity:0;transform:translateY(20px)}}

.band{background:linear-gradient(135deg,rgba(var(--rgb),.15),rgba(var(--rgb),.03));border:1px solid var(--bd);border-radius:22px;padding:30px;margin-top:30px;display:flex;gap:20px;align-items:center}.band span{font-size:34px}.band p{margin:0;color:var(--tx)}
.cg{display:grid;gap:20px;margin-top:40px;max-width:760px;margin-inline:auto}@media(min-width:640px){.cg{grid-template-columns:1fr 1fr}}
.cb{display:block;text-decoration:none;color:var(--tx);background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--bd);border-radius:20px;padding:28px;transition:.3s}
.cb:hover{transform:translateY(-6px);border-color:var(--p);box-shadow:0 16px 40px rgba(var(--rgb),.25)}.cb small{color:var(--mut);display:block;font-size:13px;letter-spacing:.1em}.cb b{font-size:18px;word-break:break-all}
/* pricing */
.pl{border-radius:26px;border:1.5px solid var(--gold);overflow:hidden;background:var(--sf);transition:.35s;display:flex;flex-direction:column}
.pl:hover{transform:translateY(-10px);box-shadow:0 24px 60px rgba(201,164,92,.2)}
.ph2{padding:28px}.ph2 .bd{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;padding:5px 14px;border-radius:99px;margin-bottom:14px}
.ph2 h3{font-size:30px;letter-spacing:.02em;margin:0}.ph2 .pr{font-size:40px;font-weight:800;margin:10px 0 0}.ph2 .pr small{font-size:15px;font-weight:400;opacity:.7}.ph2 p{margin:10px 0 0;font-size:16px}
.si .ph2{background:var(--h1);color:var(--h1t)}.si .bd{background:rgba(0,0,0,.1)}.ph2 p{color:inherit;opacity:.78}
.go{border-color:var(--p);box-shadow:0 0 50px rgba(var(--rgb),.2)}.go .ph2{background:var(--h2);color:var(--h2t)}.go .bd{background:rgba(0,0,0,.18);color:inherit}
.pt .ph2{background:var(--h3);color:var(--h3t)}.pt .bd{background:rgba(0,0,0,.12);color:inherit}
.pb{padding:26px 28px 30px;flex:1}.pb h4{margin:0 0 16px;font-size:18px}
.pb div{display:flex;gap:14px;margin-bottom:18px}.pb div span{font-size:20px;flex:none;width:26px}.pb b{display:block;font-size:16px}.pb em{font-style:normal;color:var(--mut);font-size:14px;line-height:1.5;display:block}
.tw{overflow-x:auto;margin-top:36px;border:1px solid var(--bd);border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:15px}
th,td{padding:15px 18px;text-align:center;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left;color:var(--mut)}th{background:var(--sf2)}tr:last-child td{border:0}td.y{color:var(--p)}
footer{border-top:1px solid var(--bd);padding:44px 0;text-align:center;color:var(--mut);font-size:14px}footer img{height:50px;margin-bottom:14px}footer a{color:var(--p2);text-decoration:none;margin:0 10px}
/* splash */
#sp{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#sp.out{opacity:0;visibility:hidden}
#sp .lw{position:relative;animation:lg 2s cubic-bezier(.2,.8,.2,1) both}
#sp img{width:min(78vw,480px);display:block}
@keyframes lg{0%{opacity:0;transform:scale(.7);filter:blur(14px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
#sp .lw:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(110,240,190,.55) 50%,transparent 65%);background-size:250%;mix-blend-mode:overlay;animation:sh 1.6s .9s both}
@keyframes sh{from{background-position:150%}to{background-position:-50%}}
#sp .ln{position:absolute;left:10%;right:10%;height:2px;background:#34d399;box-shadow:0 0 20px #34d399;animation:sc 1.6s .3s ease-in-out both}
@keyframes sc{0%{top:20%;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:80%;opacity:0}}
.pa{position:absolute;border-radius:50%;background:var(--p);opacity:0;animation:pa 3s ease-in-out infinite}@keyframes pa{50%{opacity:.5;transform:translateY(-40px)}}

nav span a:not(.cta){position:relative}nav span a:not(.cta):after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:0;background:var(--p);transition:width .3s}nav span a:not(.cta):hover:after{width:100%}
nav a img{transition:transform .4s}nav a:hover img{transform:scale(1.06)}
.btn:active{transform:scale(.95)}
body.go .hero>div:first-child>*{animation:up .8s both}
body.go .hero>div:first-child>*:nth-child(2){animation-delay:.12s}body.go .hero>div:first-child>*:nth-child(3){animation-delay:.24s}body.go .hero>div:first-child>*:nth-child(4){animation-delay:.36s}body.go .hero>div:first-child>*:nth-child(5){animation-delay:.48s}body.go .hero>div:first-child>*:nth-child(6){animation-delay:.6s}
body.go .ill{animation:up 1s .3s both}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.cb .ic,.mini .ic{transition:transform .4s}.cb:hover .ic,.mini .box:hover .ic{transform:scale(1.15) rotate(-6deg)}

img[alt="nexfolio"]{filter:var(--lf);mix-blend-mode:var(--lb)}#sp img{filter:none!important;mix-blend-mode:normal!important}
html.tn *{transition:background-color .6s,border-color .6s,color .6s,fill .6s!important}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:36px 0}
.tabs button,.md button{background:var(--sf);color:var(--mut);border:1px solid var(--bd);padding:12px 22px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer;transition:.25s}
.tabs button.on,.md button.on{background:var(--p);color:var(--btx);border-color:var(--p);font-weight:600}
.pg3{display:grid;gap:18px;grid-template-columns:1fr}@media(min-width:640px){.pg3{grid-template-columns:repeat(2,1fr)}}@media(min-width:960px){.pg3.g8{grid-template-columns:repeat(4,1fr)}}
.pc2{text-align:left;background:var(--sf);border:1.5px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;color:var(--tx);font:inherit;transition:.25s}
.pc2:hover{transform:translateY(-4px);border-color:var(--p)}.pc2.sel{border-color:var(--p);box-shadow:0 0 0 3px rgba(var(--rgb),.25)}
.pc2 b{display:block;font-size:16px}.pc2 small{display:block;color:var(--mut);font-size:13px;margin:2px 0 14px;line-height:1.45}
.sw{display:flex;gap:6px}.sw i{flex:1;height:42px;border-radius:8px;border:1px solid rgba(128,128,128,.3)}
.pn{text-align:center;color:var(--mut);margin:26px auto 0;max-width:560px;font-size:15px}
.wb{display:grid;gap:32px;align-items:center;max-width:780px;margin:auto;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:32px}@media(min-width:700px){.wb{grid-template-columns:260px 1fr}}
.wheel{position:relative;width:240px;height:240px;margin:auto;touch-action:none}.wheel canvas{width:100%;height:100%;border-radius:50%;cursor:crosshair;box-shadow:0 0 40px rgba(var(--rgb),.3)}

.wb h3{margin-bottom:6px}.wb label{display:block;font-size:14px;color:var(--mut);margin:18px 0 8px}.wb input[type=range]{width:100%;accent-color:var(--p)}.md{display:flex;gap:10px}.md button{padding:9px 20px}
.hx{display:inline-block;margin-top:16px;padding:8px 16px;border-radius:99px;border:1px solid var(--bd);font-weight:600;font-size:14px}
#pv{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);z-index:90;background:var(--sf);border:1px solid var(--p);color:var(--tx);padding:9px 10px 9px 20px;border-radius:99px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:transform .4s;font-size:14px;white-space:nowrap}
#pv.on{transform:translate(-50%,0)}#pv button{background:var(--p);color:var(--btx);border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.pb .btn{margin:6px 0 0;width:100%;text-align:center}

.mo{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:14px}.mo.on{display:flex;animation:pg .35s both}
